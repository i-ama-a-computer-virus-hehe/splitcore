<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Core Dominion — Prototype</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="startMenu" class="panel start-menu"><h1>CORE DOMINION</h1><p>Choose your Core name</p><input id="coreNameInput" maxlength="18" placeholder="Core name"><button id="startBtn">Start</button><div id="serverStatus">Offline prototype server</div></div><canvas id="game"></canvas>

  <div id="hud">
    <div class="panel">
      <div class="title">CORE DOMINION — TEST BUILD</div>
      <div id="stats"></div>
    </div>
    <div class="help">
      <b>WASD</b> move core &nbsp; <b>Hold LMB</b> command drones &nbsp;
      <b>Release</b> recall &nbsp; <b>Space</b> split
    </div>
  </div>
    <button id="upgradeBtn">Upgrades</button>
  <div id="upgradePanel" class="panel upgrade-panel" style="display:none"><b>UPGRADES</b><div id="upgradeList"></div></div>

  <div id="leaderboard" class="panel"><b>LEADERBOARD</b><div id="leaderboardList"></div></div><div id="message"></div>
  <script src="game.js"></script>
</body>
</html>
